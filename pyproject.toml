[project]
name = "vocelle"
version = "0.1.0"
description = "Toolkit for audio-reactive 3D music videos: music analysis -> Blender (EEVEE) scenes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "scipy>=1.11", "librosa>=0.10.2", "soundfile>=0.12"]

[project.optional-dependencies]
stems = ["demucs>=4.0"]
beats = ["beat-this", "torch>=2.0"]
notes = ["basic-pitch"]

[project.scripts]
vocelle = "vocelle.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocelle"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
